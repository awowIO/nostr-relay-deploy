# nginx for the relay's Web Console (console.yaml): one page, at exactly `/`, `/join` and
# `/join/`, with the headers the Cloudflare Worker sends with it (consolePage() in
# worker.ts). Every other path is 404. The IngressRoute sends this server only browser
# GET and HEAD requests for those three paths; WebSocket, NIP-11 and Blossom go to the relay.
#
# Self-contained on purpose: no include of the image's mime.types or conf.d, so nothing
# the image ships changes what is served. It runs as UID 101 on a read-only root
# filesystem, writing only its pid and empty temp directories under /tmp.

# One worker: the whole site is one cached file a ConfigMap holds.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    access_log /dev/stdout;
    server_tokens off;

    # The one file is HTML; nothing else is served.
    types {}
    default_type text/html;
    charset utf-8;

    server {
        listen {{ console_port }};
        root /srv/console;

        # The page's own script and style, by SHA-256, and only this relay and MayWe to talk to.
        add_header Content-Security-Policy "{{ console_policy }}" always;
        add_header Cache-Control "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        location = / { try_files /index.html =404; }
        location = /join { try_files /index.html =404; }
        location = /join/ { try_files /index.html =404; }
        location / { return 404; }
    }
}
