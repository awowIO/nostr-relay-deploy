# Rendered only with `traefik_egress_network_policy = true`: for a cluster whose Traefik
# namespace enforces default-deny egress, this opens exactly one door, from Traefik to
# the relay on 5500.
#
# Do NOT enable it where Traefik's egress is unrestricted: the first Egress policy that
# selects a pod makes everything it does not allow forbidden for that pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: {{ statefulset_name }}-backend, namespace: {{ traefik_namespace }} }
spec:
  podSelector: {{ traefik_pod_selector_flow }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ namespace }} } }
          podSelector: { matchLabels: { app: {{ app_label }} } }
      ports: [{ protocol: TCP, port: 5500 }]
