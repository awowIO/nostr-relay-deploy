# The whole public surface, and nothing else: the Caddyfile of the compose target and the
# Cloudflare Worker's edge filter carry the same routes, and a test holds the three
# together.
#
#   GET, HEAD  /                   WebSocket upgrade, NIP-11 (Accept: application/nostr+json),
#                                  or the relay's page for a browser (relay.yaml `homepage`)
#   PUT  /upload  /media/upload    signed, members-only Blossom upload
#   GET, HEAD  /<sha256>[.ext]  /media/<sha256>[.ext]   signed, members-only download
#
# Everything else never reaches the relay: its admin listener, query and metrics
# surfaces, DELETE on a blob, any other method or path. Without the Web Console, `/` is
# one route: the relay tells a WebSocket, a NIP-11 client and a browser apart.
#
# With `kubernetes.web_console = true`, `/` splits as the Worker's edgeRoute() splits it:
# a WebSocket upgrade, and any Accept that names application/nostr+json, reach the relay;
# a browser at the root, docs or join paths (where nostr-mailbox's invite links point,
# …/join/#nm1_…) reaches the console (console.yaml), which reads the token from the
# fragment in the browser. The two `/` rules exclude each other, so their equal priority
# never decides between them.
#
# Without it, `/join` and `/join/` stay shut: the pinned ncli has no page there and
# answers 404 itself, and Traefik serves no page of its own. The link then works with
# `nostr-mailbox join '<link>'`, which reads the token from the link. `/mcp`,
# `/openapi.json` and `/tools/<tool>`, the Worker's remote MCP server, stay shut either
# way: the pinned ncli has no such endpoint.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: { name: {{ statefulset_name }}, namespace: {{ namespace }} }
spec:
  entryPoints: [websecure]
  routes:
    {{ root_routes_block }}
    - match: 'Host(`{{ relay_host }}`) && Method(`PUT`) && (Path(`/upload`) || Path(`/media/upload`))'
      kind: Rule
      priority: {{ ingress_priority }}
      services: [{ name: {{ statefulset_name }}, port: 5500 }]
    - match: 'Host(`{{ relay_host }}`) && (Method(`GET`) || Method(`HEAD`)) && PathRegexp(`^/(media/)?[0-9a-f]{64}([.][a-z0-9]{1,8})?$`)'
      kind: Rule
      priority: {{ ingress_priority }}
      services: [{ name: {{ statefulset_name }}, port: 5500 }]
  tls: { certResolver: {{ cert_resolver }} }
