# The whole public surface, and nothing else: the Caddyfile of the compose target and the
# Cloudflare Worker's edge filter carry the same four routes, and a test holds the three
# together.
#
#   GET  /                         WebSocket upgrade, or NIP-11 (Accept: application/nostr+json)
#   PUT  /upload  /media/upload    signed, members-only Blossom upload
#   GET, HEAD  /<sha256>[.ext]  /media/<sha256>[.ext]   signed, members-only download
#
# Everything else never reaches the relay: its admin listener, query and metrics
# surfaces, DELETE on a blob, any other method or path.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: { name: {{ statefulset_name }}, namespace: {{ namespace }} }
spec:
  entryPoints: [websecure]
  routes:
    - match: 'Host(`{{ relay_host }}`) && Path(`/`) && Method(`GET`) && (Header(`Upgrade`, `websocket`) || Header(`Accept`, `application/nostr+json`))'
      kind: Rule
      priority: {{ ingress_priority }}
      services: [{ name: {{ statefulset_name }}, port: 5500 }]
    - match: 'Host(`{{ relay_host }}`) && Method(`PUT`) && (Path(`/upload`) || Path(`/media/upload`))'
      kind: Rule
      priority: {{ ingress_priority }}
      services: [{ name: {{ statefulset_name }}, port: 5500 }]
    - match: 'Host(`{{ relay_host }}`) && (Method(`GET`) || Method(`HEAD`)) && PathRegexp(`^/(media/)?[0-9a-f]{64}([.][a-z0-9]{1,8})?$`)'
      kind: Rule
      priority: {{ ingress_priority }}
      services: [{ name: {{ statefulset_name }}, port: 5500 }]
  tls: { certResolver: {{ cert_resolver }} }
